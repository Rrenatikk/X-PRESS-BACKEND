version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: xpress_postgres
    environment:
      POSTGRES_USER: xpress_admin
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: xpress_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data: